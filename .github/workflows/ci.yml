name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install ruff
        run: pip install ruff

      - name: Run ruff
        working-directory: backend
        run: ruff check .

  test:
    name: Tests (pytest)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run tests
        working-directory: backend
        run: pytest

  security:
    name: Security (bandit, pip-audit)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install security tools
        run: pip install bandit pip-audit

      - name: Run bandit (SAST)
        working-directory: backend
        run: bandit -r app/

      - name: Run pip-audit (SCA)
        working-directory: backend
        run: pip-audit --requirement requirements.txt

  secrets:
    name: Secrets scanning (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  frontend-lint:
    name: Frontend lint (eslint)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Run eslint
        working-directory: frontend
        run: npm run lint

  dast:
    name: DAST (OWASP ZAP baseline)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install backend dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # Start the API in the background. Host 0.0.0.0 is required because
      # the ZAP scanner runs in a separate Docker container and cannot see
      # the runner's loopback interface. In production the API binds to
      # 127.0.0.1 (Finding R-01) — this exception applies only to the CI
      # runner, for the duration of the job.
      - name: Start FastAPI in background
        working-directory: backend
        run: |
          nohup uvicorn app.main:app --host 0.0.0.0 --port 8000 > /tmp/uvicorn.log 2>&1 &

      - name: Wait for the API to be ready
        run: |
          for i in $(seq 1 15); do
            if curl -sf http://127.0.0.1:8000/api/hello > /dev/null; then
              echo "API is ready after ${i} attempts"
              exit 0
            fi
            sleep 2
          done
          echo "API did not become ready in time"
          cat /tmp/uvicorn.log
          exit 1

      - name: ZAP baseline scan
        uses: zaproxy/action-baseline@v0.14.0
        with:
          # The ZAP scanner runs in a Docker container. In Linux (GitHub
          # runners), `host.docker.internal` does not resolve — that alias
          # exists only on Docker Desktop for macOS and Windows. The
          # container reaches the runner's host through the Docker bridge
          # gateway, which is 172.17.0.1 on a default installation.
          target: "http://172.17.0.1:8000"
          # Do not fail the pipeline on the first run. The goal is to see
          # what the scan reports, decide which findings are real, and
          # tune the rules. Once tuned, `fail_action: true` will be set.
          fail_action: false
          allow_issue_writing: false
