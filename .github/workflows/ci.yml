name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# Least privilege by default. Jobs that need more declare it themselves.
permissions:
  contents: read

jobs:
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.14"

      - name: Install ruff
        # Pinned: a newer ruff may enable new default rules, producing
        # CI failures that do not reproduce locally. Versions are advanced
        # deliberately, not by accident.
        run: pip install ruff==0.16.10

      - name: Run ruff
        working-directory: backend
        run: ruff check .

  test:
    name: Tests (pytest)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.14"

      - name: Install dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Run tests
        working-directory: backend
        env:
          JWT_SECRET_FILE: ${{ runner.temp }}/jwt_secret
          DATABASE_URL: sqlite:///${{ runner.temp }}/lab.db
        run: pytest

  security:
    name: Security (bandit, pip-audit)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.14"

      - name: Install security tools
        # Pinned for the same reason as ruff above.
        run: pip install bandit==1.9.4 pip-audit==2.10.1

      - name: Run bandit (SAST)
        working-directory: backend
        run: bandit -r app/

      - name: Run pip-audit (SCA)
        working-directory: backend
        run: pip-audit --requirement requirements-dev.txt

  secrets:
    name: Secrets scanning (gitleaks)
    runs-on: ubuntu-latest
    # The gitleaks action writes its findings as a PR comment and as SARIF
    # in the repository's Security tab. Both require explicit permissions
    # that are not granted by the default GITHUB_TOKEN. Without these, the
    # job fails before the scan runs — which is what happened on the first
    # run (a 6-second failure, too fast for a real scan).
    permissions:
      contents: read
      pull-requests: write
      security-events: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Run gitleaks
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  frontend-lint:
    name: Frontend lint (eslint)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Run eslint
        working-directory: frontend
        run: npm run check:lint

  dast:
    name: DAST (OWASP ZAP baseline)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.14"

      - name: Install backend dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # Start the API in the background. Host 0.0.0.0 is required because
      # the ZAP scanner runs in a separate Docker container and cannot see
      # the runner's loopback interface. In production the API binds to
      # 127.0.0.1 (Finding R-01) — this exception applies only to the CI
      # runner, for the duration of the job.
      - name: Start FastAPI in background
        working-directory: backend
        env:
          JWT_SECRET_FILE: ${{ runner.temp }}/jwt_secret
          DATABASE_URL: sqlite:///${{ runner.temp }}/lab.db
        run: |
          nohup uvicorn app.main:app --host 0.0.0.0 --port 8000 > /tmp/uvicorn.log 2>&1 &

      - name: Wait for the API to be ready
        run: |
          for i in $(seq 1 15); do
            if curl -sf http://127.0.0.1:8000/api/hello > /dev/null; then
              echo "API is ready after ${i} attempts"
              exit 0
            fi
            sleep 2
          done
          echo "API did not become ready in time"
          cat /tmp/uvicorn.log
          exit 1

      # Authenticated scan setup. Create a throwaway admin in the CI
      # database and log in to get a bearer token for ZAP. The password is
      # generated for each run and masked in the logs; it is never stored
      # in the repository.
      - name: Create CI admin and obtain a token for ZAP
        working-directory: backend
        env:
          JWT_SECRET_FILE: ${{ runner.temp }}/jwt_secret
          DATABASE_URL: sqlite:///${{ runner.temp }}/lab.db
        run: |
          python - <<'PY'
          import json
          import os
          import secrets
          import sys
          import urllib.error
          import urllib.request

          from app.database import SessionLocal
          from app.models import User
          from app.security import hash_password

          email = "zap-ci@example.com"
          password = secrets.token_urlsafe(24)
          print("::add-mask::" + password)

          with SessionLocal() as db:
              db.add(User(email=email, password_hash=hash_password(password), role="admin"))
              db.commit()

          request = urllib.request.Request(
              "http://127.0.0.1:8000/api/auth/login",
              data=json.dumps({"email": email, "password": password}).encode(),
              headers={"Content-Type": "application/json"},
              method="POST",
          )
          try:
              with urllib.request.urlopen(request, timeout=10) as response:
                  token = json.load(response)["access_token"]
          except urllib.error.HTTPError as error:
              print("Login failed with HTTP status", error.code)
              sys.exit(1)

          print("::add-mask::" + token)
          with open(os.environ["GITHUB_ENV"], "a") as env_file:
              print("ZAP_AUTH_HEADER=Authorization", file=env_file)
              print("ZAP_AUTH_HEADER_VALUE=Bearer " + token, file=env_file)
          print("CI admin created and token stored for ZAP")
          PY

      - name: ZAP baseline scan
        uses: zaproxy/action-baseline@de8ad967d3548d44ef623df22cf95c3b0baf8b25 # v0.15.0
        with:
          # The ZAP scanner runs in a Docker container. In Linux (GitHub
          # runners), `host.docker.internal` does not resolve — that alias
          # exists only on Docker Desktop for macOS and Windows. The
          # container reaches the runner's host through the Docker bridge
          # gateway, which is 172.17.0.1 on a default installation.
          target: "http://172.17.0.1:8000"
          rules_file_name: ".zap/rules.tsv"
          # The scan fails the job on any alert that is not ignored in
          # .zap/rules.tsv. The rules file was tuned first: with it, the
          # baseline reports no new alerts on main.
          fail_action: true
          allow_issue_writing: false

      # Authenticated API scan. The target is the OpenAPI document served
      # by the API; ZAP builds its requests from the paths it lists. The
      # Authorization header comes from ZAP_AUTH_HEADER and
      # ZAP_AUTH_HEADER_VALUE, set by the token step above. The artifact
      # name differs from the baseline scan so the two uploads do not
      # collide. Same policy as the baseline: fail on any alert not ignored in the rules file.
      - name: ZAP API scan (authenticated)
        uses: zaproxy/action-api-scan@5158fe4d9d8fcc75ea204db81317cce7f9e5453d # v0.10.0
        with:
          target: "http://172.17.0.1:8000/openapi.json"
          format: openapi
          rules_file_name: ".zap/rules.tsv"
          fail_action: true
          allow_issue_writing: false
          artifact_name: zap_api_scan
