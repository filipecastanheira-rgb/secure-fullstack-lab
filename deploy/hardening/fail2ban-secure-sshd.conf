# =============================================================================
# Fail2Ban filter — secure-sshd
#
# Custom filter for OpenSSH 9.x+ on Ubuntu 24.04+.
#
# Two reasons we don't use the packaged `sshd` filter:
#   1. The authentication worker process is named `sshd-session`, not `sshd`.
#      The default filter restricts to `_COMM=sshd` and misses our entries.
#   2. We also want to count "Connection closed by authenticating user ..."
#      as a failed attempt — otherwise clients that give up before sending a
#      key go completely unnoticed.
#
# The <HOST> tag is Fail2Ban's placeholder for "the IP address to ban".
# =============================================================================

[Definition]

failregex = ^.*Failed publickey for (invalid user )?<F-USER>.+?</F-USER> from <HOST> port \d+ ssh2(: .*)?$
            ^.*Failed password for (invalid user )?<F-USER>.+?</F-USER> from <HOST> port \d+ ssh2$
            ^.*Invalid user <F-USER>.+?</F-USER> from <HOST> port \d+$
            ^.*Connection closed by authenticating user <F-USER>.+?</F-USER> <HOST> port \d+ \[preauth\]$
            ^.*Connection closed by <HOST> port \d+ \[preauth\]$

ignoreregex =
