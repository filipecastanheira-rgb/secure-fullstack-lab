# =============================================================================
# Secure Fullstack Lab — SSH hardening
#
# Drop-in file: only the settings we want to override are listed here.
# Applied *after* /etc/ssh/sshd_config because of the 99- prefix.
#
# This file is a Jinja2 template rendered by deploy/ansible/hardening.yml.
# If you copy it by hand, replace the AllowUsers placeholder with the
# real login name first.
#
# Break-glass: if SSH access is lost, use the VMware console.
# =============================================================================

# --- Authentication ---

# Key-only authentication. Passwords are disabled.
PasswordAuthentication no
PubkeyAuthentication yes
KbdInteractiveAuthentication no
ChallengeResponseAuthentication no

# Refuse accounts with empty passwords (belt and suspenders).
PermitEmptyPasswords no

# --- Root access ---

# Root can never log in via SSH, regardless of authentication method.
PermitRootLogin no

# --- Account access ---

# Only allow the operator user (operator_user in the Ansible playbook).
# Everyone else is rejected before auth.
AllowUsers {{ operator_user }}

# --- Session behaviour ---

# Limit the time the server waits for authentication.
LoginGraceTime 30

# Maximum attempts per connection.
MaxAuthTries 3

# Kill idle sessions after 10 minutes (client-alive checks).
ClientAliveInterval 300
ClientAliveCountMax 2

# Maximum concurrent sessions per network connection.
MaxSessions 2

# --- Protocol features we do not use ---

# No X11 forwarding — no GUI over SSH in this lab.
X11Forwarding no

# No TCP forwarding — prevents using the server as a jump host.
AllowTcpForwarding no

# No agent forwarding — avoids leaking the client's keys.
AllowAgentForwarding no

# No .rhosts-style trust — ancient and insecure.
IgnoreRhosts yes
HostbasedAuthentication no

# --- Logging ---

# Log at INFO level so Fail2Ban can see failed auth attempts.
LogLevel INFO

