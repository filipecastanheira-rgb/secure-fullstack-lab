# =============================================================================
# Audit rules — Secure Fullstack Lab
#
# Watches on paths whose integrity matters for the security of the lab.
#
# Two watch types are used:
#   -w path -p wa    → write + attribute change (edits, permission changes)
#   -w path -p r     → read (only on small, high-value paths — see below)
#
# A watch on reads for /etc/ would generate millions of events per hour
# (every process reads /etc/passwd, /etc/hosts, etc.). Watches on writes
# are the ones that matter for integrity.
#
# For ~/pki/, reads are recorded as well: it contains only a handful of
# files, and any read of the CA private key is worth knowing about.
# =============================================================================

# --- System configuration ---
-w /etc/ssh/sshd_config -p wa -k ssh_config
-w /etc/ssh/sshd_config.d/ -p wa -k ssh_config_d
-w /etc/nginx/ -p wa -k nginx_config
-w /etc/ufw/ -p wa -k ufw_config
-w /etc/fail2ban/ -p wa -k fail2ban_config
-w /etc/systemd/system/ -p wa -k systemd_units
-w /etc/passwd -p wa -k identity
-w /etc/shadow -p wa -k identity
-w /etc/sudoers -p wa -k sudoers
-w /etc/sudoers.d/ -p wa -k sudoers
-w /etc/audit/rules.d/ -p wa -k audit_config

# --- Application directory ---
# Production code (the API's WorkingDirectory) and the working tree
# it is deployed from. Same key, so one ausearch -k app_backend
# covers both.
-w /opt/secure-fullstack/backend/ -p wa -k app_backend
-w /home/filipe/secure-fullstack-lab/backend/ -p wa -k app_backend

# --- PKI (reads monitored: small directory, high value) ---
-w /home/filipe/pki/ -p rwa -k pki

# --- Privilege escalation (every sudo invocation) ---
-a always,exit -F arch=b64 -S execve -F euid=0 -F auid>=1000 -F auid!=-1 -k privilege_escalation

# --- Systemd service management ---
-w /usr/bin/systemctl -p x -k systemctl_exec
