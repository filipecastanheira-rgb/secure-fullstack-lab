---
# Hardening playbook for the Secure Fullstack Lab.
#
# Replicates the manual hardening that was done across Phases 3 to 9,
# in a form that is idempotent and reproducible. Running it against a
# fresh Ubuntu VM takes the system to the same state as the current one.
#
# Key principles:
# - Every task is idempotent. Running the playbook twice produces no
#   change on the second run.
# - Configuration is written to drop-in files, not to the main config
#   files. This avoids conflicts with package updates.
# - Services are validated before being restarted. A syntax error in a
#   config file fails the task, not the running service.
# - Handlers restart services only when their config changed.

- name: Harden the Secure Fullstack Lab server
  hosts: localhost
  become: true
  gather_facts: true

  vars:
    ssh_hardening_file: /etc/ssh/sshd_config.d/99-hardening.conf
    fail2ban_jail_file: /etc/fail2ban/jail.local
    fail2ban_filter_file: /etc/fail2ban/filter.d/secure-sshd.conf
    audit_rules_file: /etc/audit/rules.d/secure-fullstack.rules
    operator_user: filipe
    operator_home: /home/filipe

  tasks:

    # =========================================================================
    # SSH
    # =========================================================================

    - name: Write the SSH hardening drop-in
      ansible.builtin.template:
        src: ../hardening/sshd-hardening.conf
        dest: "{{ ssh_hardening_file }}"
        owner: root
        group: root
        mode: "0644"
      notify: Validate and restart ssh

    # =========================================================================
    # UFW
    # =========================================================================

    - name: Install UFW
      ansible.builtin.apt:
        name: ufw
        state: present
        update_cache: false

    - name: Set UFW default policy — deny incoming
      community.general.ufw:
        policy: deny
        direction: incoming

    - name: Set UFW default policy — allow outgoing
      community.general.ufw:
        policy: allow
        direction: outgoing

    - name: Allow SSH from the Kali VM only
      community.general.ufw:
        rule: allow
        from_ip: 192.168.1.125
        to_port: "22"
        proto: tcp
        comment: "SSH from Kali"

    - name: Allow HTTP
      community.general.ufw:
        rule: allow
        port: "80"
        proto: tcp
        comment: "HTTP (redirects to HTTPS)"

    - name: Allow HTTPS
      community.general.ufw:
        rule: allow
        port: "443"
        proto: tcp
        comment: "HTTPS"

    - name: Enable UFW
      community.general.ufw:
        state: enabled

    # =========================================================================
    # Fail2Ban
    # =========================================================================

    - name: Install Fail2Ban
      ansible.builtin.apt:
        name:
          - fail2ban
        state: present
        update_cache: false

    - name: Write the Fail2Ban jail configuration
      ansible.builtin.copy:
        src: ../hardening/fail2ban-jail.local
        dest: "{{ fail2ban_jail_file }}"
        owner: root
        group: root
        mode: "0644"
      notify: Validate and restart fail2ban

    - name: Write the custom Fail2Ban filter for sshd-session
      ansible.builtin.copy:
        dest: "{{ fail2ban_filter_file }}"
        owner: root
        group: root
        mode: "0644"
        content: |
          # Managed by Ansible.
          # Custom filter for OpenSSH 9.x+, where the authentication
          # worker process is named sshd-session.
          [Definition]
          failregex = ^.*Failed publickey for (invalid user )?<F-USER>.+?</F-USER> from <HOST> port \d+ ssh2(: .*)?$
                      ^.*Failed password for (invalid user )?<F-USER>.+?</F-USER> from <HOST> port \d+ ssh2$
                      ^.*Invalid user <F-USER>.+?</F-USER> from <HOST> port \d+$
                      ^.*Connection closed by authenticating user <F-USER>.+?</F-USER> <HOST> port \d+ \[preauth\]$
                      ^.*Connection closed by <HOST> port \d+ \[preauth\]$
          ignoreregex =
      notify: Validate and restart fail2ban

    # =========================================================================
    # auditd
    # =========================================================================

    - name: Install auditd
      ansible.builtin.apt:
        name:
          - auditd
          - audispd-plugins
        state: present
        update_cache: false

    - name: Write the audit rules
      ansible.builtin.copy:
        dest: "{{ audit_rules_file }}"
        owner: root
        group: root
        mode: "0640"
        content: |
          # Managed by Ansible.
          # See deploy/hardening/audit-rules.conf for the full rationale.
          -w /etc/ssh/sshd_config -p wa -k ssh_config
          -w /etc/ssh/sshd_config.d/ -p wa -k ssh_config_d
          -w /etc/nginx/ -p wa -k nginx_config
          -w /etc/ufw/ -p wa -k ufw_config
          -w /etc/fail2ban/ -p wa -k fail2ban_config
          -w /etc/systemd/system/ -p wa -k systemd_units
          -w /etc/passwd -p wa -k identity
          -w /etc/shadow -p wa -k identity
          -w /etc/sudoers -p wa -k sudoers
          -w /etc/sudoers.d/ -p wa -k sudoers
          -w /etc/audit/rules.d/ -p wa -k audit_config
          -w /home/filipe/secure-fullstack-lab/backend/ -p wa -k app_backend
          -w /opt/secure-fullstack/backend/ -p wa -k app_backend
          -w /home/filipe/pki/ -p rwa -k pki
          -a always,exit -F arch=b64 -S execve -F euid=0 -F auid>=1000 -F auid!=-1 -k privilege_escalation
          -w /usr/bin/systemctl -p x -k systemctl_exec
      notify: Load audit rules

    # =========================================================================
    # System — umask and unused protocols
    # =========================================================================

    - name: Disable unused network protocols
      ansible.builtin.copy:
        dest: /etc/modprobe.d/disable-unused-protocols.conf
        owner: root
        group: root
        mode: "0644"
        content: |
          # Managed by Ansible.
          install dccp /bin/true
          install sctp /bin/true
          install rds /bin/true
          install tipc /bin/true

    - name: Set umask in /etc/login.defs
      ansible.builtin.lineinfile:
        path: /etc/login.defs
        regexp: "^UMASK"
        line: "UMASK\t\t027"
        state: present

    # =========================================================================
    # Verification — the umask gap found in the manual hardening
    # =========================================================================

    - name: Check the effective umask in a new login shell
      ansible.builtin.shell: |
        su - {{ operator_user }} -c 'umask'
      register: effective_umask
      changed_when: false
      failed_when: false

    - name: Report the effective umask
      ansible.builtin.debug:
        msg: >
          Effective umask for {{ operator_user }} in a fresh login:
          {{ effective_umask.stdout | default('unknown') }}.
          Declared in /etc/login.defs: 027.
          If the two differ, the gap is documented in docs/JOURNAL.md
          and must be investigated (GDM/PAM ordering).


    # =========================================================================
    # Privilege separation (Phase 9)
    #
    # The application runs as a dedicated system user with no shell and
    # no sudo. It can only read its own code (in /opt/) and its own data
    # (in /var/lib/). It cannot read the PKI directory, the SSH key, or
    # anything else in /home/filipe/.
    #
    # Note on scope: this playbook assumes the repository has been cloned
    # to ~/secure-fullstack-lab/ on the target host. Deploying the code
    # from a remote repository is a separate concern, out of scope for a
    # hardening playbook.
    # =========================================================================

    - name: Create the secure-app system user
      ansible.builtin.user:
        name: secure-app
        system: true
        create_home: false
        home: /nonexistent
        shell: /usr/sbin/nologin

    - name: Create the application data directory
      ansible.builtin.file:
        path: /var/lib/secure-fullstack
        state: directory
        owner: secure-app
        group: secure-app
        mode: "0750"

    - name: Create the application runtime directory
      ansible.builtin.file:
        path: /opt/secure-fullstack
        state: directory
        owner: "{{ operator_user }}"
        group: secure-app
        mode: "0750"

    - name: Copy the backend code to /opt
      ansible.posix.synchronize:
        src: "{{ operator_home }}/secure-fullstack-lab/backend/"
        dest: /opt/secure-fullstack/backend/
        recursive: yes
        archive: no
        checksum: yes
        delete: yes
        rsync_opts:
          - "--exclude=.venv"
          - "--exclude=__pycache__"
          - "--exclude=.jwt_secret"
          - "--exclude=*.db"
          - "--exclude=tests"
      notify: Reload systemd and restart api

    - name: Chown the backend code to secure-app
      ansible.builtin.file:
        path: /opt/secure-fullstack/backend
        state: directory
        recurse: true
        owner: secure-app
        group: secure-app

    - name: Copy lab.db if it exists in the source and not in the destination
      ansible.builtin.stat:
        path: /var/lib/secure-fullstack/lab.db
      register: lab_db_dest

    - name: Migrate lab.db from the source location
      ansible.builtin.shell: |
        mv "{{ operator_home }}/secure-fullstack-lab/backend/lab.db" /var/lib/secure-fullstack/lab.db
        chown secure-app:secure-app /var/lib/secure-fullstack/lab.db
        chmod 640 /var/lib/secure-fullstack/lab.db
      when: not lab_db_dest.stat.exists
      args:
        creates: /var/lib/secure-fullstack/lab.db

    - name: Migrate .jwt_secret from the source location
      ansible.builtin.stat:
        path: /var/lib/secure-fullstack/.jwt_secret
      register: jwt_dest

    - name: Copy .jwt_secret to the data directory
      ansible.builtin.shell: |
        cp "{{ operator_home }}/secure-fullstack-lab/backend/.jwt_secret" /var/lib/secure-fullstack/.jwt_secret
        chown secure-app:secure-app /var/lib/secure-fullstack/.jwt_secret
        chmod 600 /var/lib/secure-fullstack/.jwt_secret
      when:
        - not jwt_dest.stat.exists
        - lookup('ansible.builtin.fileglob', operator_home + '/secure-fullstack-lab/backend/.jwt_secret') | length > 0

    - name: Create the Python venv
      ansible.builtin.command:
        cmd: /usr/bin/python3 -m venv /opt/secure-fullstack/venv
        creates: /opt/secure-fullstack/venv/bin/python3

    - name: Install backend dependencies into the venv
      ansible.builtin.pip:
        requirements: /opt/secure-fullstack/backend/requirements.txt
        virtualenv: /opt/secure-fullstack/venv

    - name: Chown the venv to secure-app
      ansible.builtin.file:
        path: /opt/secure-fullstack/venv
        state: directory
        recurse: true
        owner: secure-app
        group: secure-app

    - name: Write the systemd unit for the API
      ansible.builtin.copy:
        dest: /etc/systemd/system/secure-fullstack-api.service
        owner: root
        group: root
        mode: "0644"
        content: |
          [Unit]
          Description=Secure Fullstack Lab — FastAPI backend
          After=network.target

          [Service]
          Type=simple
          User=secure-app
          Group=secure-app
          WorkingDirectory=/opt/secure-fullstack/backend
          ExecStart=/opt/secure-fullstack/venv/bin/python3 -m uvicorn app.main:app --host 127.0.0.1 --port 8000 --no-access-log
          Restart=on-failure
          RestartSec=3

          [Install]
          WantedBy=multi-user.target
      notify: Reload systemd and restart api

    - name: Enable and start the API service
      ansible.builtin.systemd:
        name: secure-fullstack-api
        enabled: true
        state: started
        daemon_reload: true

    - name: Create the static content directory
      ansible.builtin.file:
        path: /var/www/secure-fullstack
        state: directory
        owner: www-data
        group: www-data
        mode: "0755"

    - name: Copy the built frontend to /var/www
      ansible.posix.synchronize:
        src: "{{ operator_home }}/secure-fullstack-lab/frontend/dist/"
        dest: /var/www/secure-fullstack/
        recursive: yes
        archive: no
        checksum: yes
        delete: yes
      register: frontend_sync

    - name: Fix ownership of the served static files
      ansible.builtin.file:
        path: /var/www/secure-fullstack
        state: directory
        recurse: true
        owner: www-data
        group: www-data
      when: frontend_sync is changed

    - name: Revoke traverse permission on the operator home
      ansible.builtin.file:
        path: "{{ operator_home }}"
        state: directory
        mode: "0750"

  # ===========================================================================
  # Handlers — run only when notified by a changed task
  # ===========================================================================

  handlers:

    # Handlers use `shell` with `&&` rather than `block:`.
    # The `block:` form inside a handler is not reliably resolved by
    # Ansible, and the failure is confusing. The shell form is simpler:
    # if the validation fails, the `&&` stops the restart and the
    # playbook fails — which is the correct behaviour.

    - name: Validate and restart ssh
      ansible.builtin.shell: sshd -t && systemctl restart ssh
      args:
        executable: /bin/bash

    - name: Validate and restart fail2ban
      ansible.builtin.shell: fail2ban-client -t && systemctl restart fail2ban
      args:
        executable: /bin/bash

    - name: Load audit rules
      ansible.builtin.command: augenrules --load
      changed_when: true
