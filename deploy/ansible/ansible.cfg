[defaults]
# Inventory file to use when running playbooks from this directory.
inventory = inventory.yml

# Do not create a retry file on failure. Keeps the directory clean.
retry_files_enabled = False

# Do not gather facts on every play. We will gather them explicitly
# where needed.
gathering = explicit

# Human-readable output.
stdout_callback = default

# Disable host key checking for local connections.
# (The lab runs playbooks against localhost, not over SSH.)
host_key_checking = False

[privilege_escalation]
# The playbook needs root to modify /etc/, manage services, etc.
# The escalation is requested per-task or per-play via `become: true`,
# not globally — see hardening.yml.
become = False
become_method = sudo
become_user = root
